[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mental-wellbeing"
version = "1.0.0"
description = "Student wellbeing clustering, risk prediction, and explainable AI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2", "numpy>=1.26", "scikit-learn>=1.4", "joblib>=1.3", "streamlit>=1.36", "flask>=3.0", "plotly>=5.22", "matplotlib>=3.8", "seaborn>=0.13", "shap>=0.46", "lime>=0.2.0.1", "pypdf>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]
